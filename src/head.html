<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powder Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/planck@1.4.2/dist/planck.min.js"></script>
<style>
/* Layout idea: one-screen workshop bench. Tool rail on the left, the sim fills the rest, a fixed status strip along the bottom. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --bench: #151b24;
  --panel: #1e2631;
  --edge: #313c4b;
  --ink: #dbe3ec;
  --dim: #8a97a8;
  --flame: #f2a33a;
  --font-display: "Chakra Petch", "Trebuchet MS", sans-serif;
  --font-body: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bench);
  color: var(--ink);
  font: 13px/1.4 var(--font-body);
  display: flex;
  flex-direction: column;
}
header {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--edge);
}
h1 {
  font: 700 18px/1 var(--font-display);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0;
  color: var(--flame);
}
.spacer { flex: 1; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
label { color: var(--dim); }
button, select {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
}
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--flame);
  outline-offset: 2px;
}
button[aria-pressed="true"] {
  border-color: var(--flame);
  color: var(--flame);
  background: #2a2a26;
}
main {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 12px;
  padding: 12px 16px;
}
#tools {
  display: flex;
  flex-direction: column;
  gap: 5px;
  width: 132px;
  flex: none;
  overflow-y: auto;
}
#tools button {
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  padding: 5px 10px;
}
.sep { height: 1px; background: var(--edge); margin: 3px 0; flex: none; }
.sw {
  width: 12px; height: 12px;
  border-radius: 2px;
  flex: none;
  border: 1px solid rgba(255,255,255,0.25);
}
.sw.round { border-radius: 50%; background: transparent; border: 2px solid; }
.key { margin-left: auto; color: var(--dim); font-size: 11px; }
.brush { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.brush input { width: 100%; accent-color: var(--flame); }
#stage {
  flex: 1;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: #0b0f14;
  border: 1px solid var(--edge);
  border-radius: 4px;
}
#stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
#view { image-rendering: pixelated; touch-action: none; cursor: crosshair; }
#overlay { pointer-events: none; }
#inspector {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 210px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px 12px;
  background: rgba(21, 27, 36, 0.94);
  border: 1px solid var(--edge);
  border-radius: 6px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
}
#inspector[hidden], #inspector [hidden] { display: none; }
.ins-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ins-head strong { font: 700 15px/1 var(--font-display); letter-spacing: 0.03em; text-transform: uppercase; }
#insClose { padding: 0 8px; font-size: 16px; line-height: 24px; }
#insSub { margin: -4px 0 0; color: var(--dim); font-size: 12px; }
.seg { display: flex; }
.seg button { flex: 1; border-radius: 0; }
.seg button:first-child { border-radius: 4px 0 0 4px; }
.seg button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
.fields { display: flex; flex-direction: column; gap: 3px; }
.fields input { width: 100%; accent-color: var(--flame); margin-bottom: 4px; }
.fields label span { color: var(--ink); }
.row { display: flex; gap: 6px; }
.row button { flex: 1; }
button.danger:hover { border-color: #e0605a; color: #f08a84; }
button.primary { border-color: var(--flame); color: var(--flame); min-width: 64px; }
button:disabled { opacity: 0.4; cursor: default; }
button:disabled:hover { border-color: var(--edge); }
.chip {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid currentColor;
}
.chip[data-mode="build"] { color: #f5d76e; }
.chip[data-mode="run"] { color: #7bd88f; }
.sw.track { background: transparent; border: none; border-top: 2px solid; border-bottom: 2px solid; height: 8px; border-radius: 0; }
.sw.arrow { border: none; background: none; color: var(--dim); font-size: 13px; line-height: 12px; text-align: center; }
footer {
  flex: none;
  height: 38px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 16px;
  border-top: 1px solid var(--edge);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}
footer span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hint { color: var(--flame); flex: 1 1 auto; min-width: 0; }
#readout { color: var(--dim); flex: none; width: 34ch; text-align: right; }
@media (max-width: 640px) {
  main { flex-direction: column; }
  #tools { flex-direction: row; flex-wrap: wrap; width: auto; overflow: visible; }
  #tools button { flex: 1 1 88px; }
  .key, .sep { display: none; }
  .brush { flex: 1 1 100%; margin-top: 0; }
  #stage { min-height: 240px; }
  #inspector { width: 180px; }
  #readout { width: 26ch; font-size: 11px; }
}
</style>
</head>
